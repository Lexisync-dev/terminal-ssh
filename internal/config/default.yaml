projects:
  - id: "workflow-engine"
    name: "Workflow Automation Platform"
    tagline: "Trigger-action automation engine inspired by n8n and Zapier"
    status: "In Development"
    description: >
      A workflow automation platform designed to let users connect triggers, actions, and integrations to automate repetitive tasks through configurable workflows.
    conceptual_example: >
      "When a GitHub issue is created, trigger a workflow, process the issue, generate an AI summary, and send the summary to Slack."
    stack:
      - "Go"
      - "React"
      - "TypeScript"
      - "PostgreSQL"
      - "Redis"
      - "Docker"
    architecture_areas:
      - "Workflow representation and storage"
      - "Trigger management"
      - "Workflow execution engine"
      - "Background job processing"
      - "Queue architecture"
      - "External integrations"
      - "Execution history and logging"
      - "Error handling and retries"
    decisions:
      - "Chose Go for the execution engine to leverage goroutine-based concurrency and low runtime overhead."
      - "Designed a directed acyclic graph (DAG) representation for workflow node execution order."
      - "Separated trigger intake from worker execution using Redis-backed queues for reliable job delivery."
    challenges:
      - "Ensuring idempotent execution when external services or network steps fail midway."
      - "Designing an extensible schema for arbitrary action inputs/outputs while keeping state predictable."
    learnings:
      - "Deepened understanding of distributed task queues and retry backoff strategies."
      - "Appreciation for strict state machine boundaries when coordinating asynchronous steps."

